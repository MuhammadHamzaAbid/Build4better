  <text x='195' y='523' fill='#FFFFFF' font-family='system-ui, sans-serif' font-size='18' font-weight='700' text-anchor='middle'>Nahi, kisi ko nahi batana</text>

  <text x='195' y='585' fill='#57606A' font-family='system-ui, sans-serif' font-size='12' font-weight='500' text-anchor='middle'>OTP ek khufiya code hai jo kisi ko nahi batate</text>
