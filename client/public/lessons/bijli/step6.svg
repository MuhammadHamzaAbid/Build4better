  <text x='195' y='155' fill='#B43428' font-family='system-ui, sans-serif' font-size='18' font-weight='800' letter-spacing='0.5' text-anchor='middle'>ANJAAN CALLER!</text>
  <text x='195' y='180' fill='#57606A' font-family='system-ui, sans-serif' font-size='14' text-anchor='middle'>Phone: 0312-9844122</text>

