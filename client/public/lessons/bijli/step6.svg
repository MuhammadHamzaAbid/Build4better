<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 650' width='390' height='650'>
  <rect width='390' height='650' fill='#1F2428'/>
  
  <rect x='20' y='28' width='350' height='594' rx='18' fill='#FFFFFF'/>

