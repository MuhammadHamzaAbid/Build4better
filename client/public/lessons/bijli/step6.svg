  <text x='195' y='236' fill='#8A4B06' font-family='system-ui, sans-serif' font-size='14' font-weight='700' text-anchor='middle'>Caller Keh Raha Hai:</text>
  <text x='54' y='266' fill='#171A1C' font-family='system-ui, sans-serif' font-size='14'>'Main bank se bol raha hoon.</text>
  <text x='54' y='292' fill='#171A1C' font-family='system-ui, sans-serif' font-size='14'>Aap ke phone par 4-digit OTP</text>
  <text x='54' y='318' fill='#171A1C' font-family='system-ui, sans-serif' font-size='14'>aaya hai, foran bata dein.'</text>

  <!-- Trap Button: Bata dein (10%, 58%, 80%, 11%) -->
